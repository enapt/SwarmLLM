[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmllm-client"
version = "0.1.0"
description = "Python client SDK for SwarmLLM — decentralized P2P LLM inference"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "SwarmLLM Contributors" },
]
keywords = ["llm", "inference", "p2p", "swarmllm", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
all = ["langchain-core>=0.2", "llama-index-core>=0.10"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "aioresponses>=0.7",
    "responses>=0.23",
]

[project.urls]
Homepage = "https://github.com/swarmllm/swarmllm"
Documentation = "https://github.com/swarmllm/swarmllm/tree/main/python"
Repository = "https://github.com/swarmllm/swarmllm"
Issues = "https://github.com/swarmllm/swarmllm/issues"
