# ============================================================================
# SwarmLLM — Production Single-Node Deployment
# ============================================================================
# Quick start:
#   cp .env.example .env        # Edit with your API keys
#   docker-compose up -d        # Start in background
#   open http://localhost:8800   # Admin dashboard
#
# GPU support:
#   docker-compose --profile gpu up -d
#
# Stop:
#   docker-compose down
#
# View logs:
#   docker-compose logs -f
# ============================================================================

services:
  swarmllm:
    build: .
    image: ghcr.io/enapt/swarmllm:latest
    container_name: swarmllm
    ports:
      - "${SWARMLLM_NODE_LISTEN_PORT:-8800}:8800/tcp"     # HTTP API + dashboard
      - "${SWARMLLM_NODE_LISTEN_PORT:-8800}:8800/udp"     # P2P QUIC
      - "${SWARMLLM_P2P_TCP_PORT:-8810}:8810/tcp"         # P2P TCP (Noise+Yamux)
    volumes:
      - swarmllm-data:/data
      - ${SWARMLLM_MODELS_DIR:-swarmllm-models}:/data/models  # Model/shard storage
    env_file:
      - .env
    environment:
      - SWARMLLM_NODE_DATA_DIR=/data
      - SWARMLLM_UI_OPEN_BROWSER_ON_START=false
    restart: unless-stopped
    profiles: ["", "cpu"]

  swarmllm-gpu:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    image: ghcr.io/enapt/swarmllm:cuda
    container_name: swarmllm
    ports:
      - "${SWARMLLM_NODE_LISTEN_PORT:-8800}:8800/tcp"
      - "${SWARMLLM_NODE_LISTEN_PORT:-8800}:8800/udp"
      - "${SWARMLLM_P2P_TCP_PORT:-8810}:8810/tcp"
    volumes:
      - swarmllm-data:/data
      - ${SWARMLLM_MODELS_DIR:-swarmllm-models}:/data/models
    env_file:
      - .env
    environment:
      - SWARMLLM_NODE_DATA_DIR=/data
      - SWARMLLM_UI_OPEN_BROWSER_ON_START=false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    profiles: ["gpu"]

volumes:
  swarmllm-data:
  swarmllm-models:
