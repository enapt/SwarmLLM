[package]
name = "swarmllm-types"
version = "0.2.0-alpha"
edition = "2021"
description = "Core types for the SwarmLLM decentralized inference network"
license = "MIT OR Apache-2.0"
repository = "https://github.com/enapt/SwarmLLM"
homepage = "https://github.com/enapt/SwarmLLM"
rust-version = "1.90"

[dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` matches the root crate: `InferenceRequest.tools` carries the
# caller's tool schemas as JSON values, and their key order is part of what the
# model is shown (see the root Cargo.toml).
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
