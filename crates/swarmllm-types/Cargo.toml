[package]
name = "swarmllm-types"
version = "0.1.0"
edition = "2021"
description = "Core types for the SwarmLLM decentralized inference network"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
