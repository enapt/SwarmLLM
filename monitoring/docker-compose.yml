# Quick-start monitoring stack for SwarmLLM.
#
# Usage:
#   cd monitoring/
#   cp .env.example .env         # required — sets Grafana admin credentials
#   docker compose up -d
#
# Then open:
#   - Grafana:    http://localhost:3000
#   - Prometheus: http://localhost:9090
#
# Security: GRAFANA_ADMIN_USER and GRAFANA_ADMIN_PASSWORD have no defaults.
# Compose will refuse to start without them set in `.env`. This is to make
# sure no one accidentally ships an admin/admin Grafana behind a load
# balancer.  For local development, copy `.env.example` and the placeholder
# admin/admin still works — but the choice is explicit.
#
# The SwarmLLM dashboard is auto-provisioned on first start.

services:
  prometheus:
    # SEC: pin to a specific upstream version. `:latest` floats — a Docker
    # Hub compromise or breaking upstream release silently lands on every
    # `docker compose pull`. Bump deliberately, not accidentally.
    image: prom/prometheus:v3.5.0
    ports:
      # Bind only to loopback. The metrics scrape target (the SwarmLLM node
      # itself, on host.docker.internal) is reachable, but Prometheus's own
      # admin UI is NOT exposed beyond the operator's machine by default.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      # Loopback-only; same rationale as Prometheus above.
      - "127.0.0.1:3000:3000"
    environment:
      # No `:-admin` default. If the env var isn't set, docker compose
      # passes an empty string to Grafana, Grafana refuses to start, and
      # the operator sees the failure immediately. Better than silently
      # shipping with admin/admin.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env (see .env.example)}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (see .env.example)}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/swarmllm/grafana-dashboard.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./:/var/lib/grafana/dashboards/swarmllm:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
