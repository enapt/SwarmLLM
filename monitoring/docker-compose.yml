# Quick-start monitoring stack for SwarmLLM.
#
# Usage:
#   cd monitoring/
#   cp .env.example .env         # optional — set a real password
#   docker compose up -d
#
# Then open:
#   - Grafana:    http://localhost:3000
#   - Prometheus: http://localhost:9090
#
# Grafana admin credentials default to admin/admin (dev-only). For anything
# exposed beyond localhost, set GRAFANA_ADMIN_USER and GRAFANA_ADMIN_PASSWORD
# in a .env file next to this compose file — see .env.example.
#
# The SwarmLLM dashboard is auto-provisioned on first start.

services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/swarmllm/grafana-dashboard.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./:/var/lib/grafana/dashboards/swarmllm:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
