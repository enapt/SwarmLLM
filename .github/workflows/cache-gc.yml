####################################################################
# Keep the Actions cache under GitHub's per-repository limit, so the
# EXPENSIVE caches are never the ones evicted.
#
# The problem this solves
# -----------------------
# GitHub gives a repository 10 GB of Actions cache at no cost and, once
# that is exceeded, evicts least-recently-used entries. (Since
# 2025-11-20 the ceiling can be raised beyond 10 GB, but only on a paid
# plan and only by paying for the storage, so for this repo 10 GB is
# still a hard wall.)
#
# That eviction order is exactly backwards for us. The Linux CUDA
# release cache is the single most expensive thing here: 1.5 GB, built
# by a ~55 min `cache-warm` run, and restored only by releases and the
# weekly warm. Every ordinary push, meanwhile, refreshes ~4 GB of CI
# caches. So the CUDA cache is reliably the OLDEST-by-last-access large
# entry, and is first out of the door when the cap is hit. The 32 MB
# `flash-attn-kernels-*` entries are worse off still: smallest, rarely
# touched, and the most expensive per byte to rebuild — one saved at
# 08:47 was gone by 13:32 (gotcha #538).
#
# MEASURED, 2026-08-10. Cache total stood at 9.37 GB of 10 GB. The
# Linux CUDA release build takes 30-37 min with a warm cache — and took
# **102 min** on 2026-08-08, a cold rebuild, in the same window a stale
# CI generation (1.65 GB, 4 entries) was sitting unread. That is ~67
# minutes added to a release by an eviction nothing needed to suffer.
#
# MEASURED AGAIN, 2026-09-11: 11.15 GB across 26 entries, i.e. already
# over the wall. **3.65 GB of it was on refs nothing can ever restore
# from** — 2.80 GB on two pull-request refs and 0.85 GB on a tag ref —
# and this workflow could not see any of it. See "What it does" below;
# both gaps are now closed.
#
# What a cache's REF means, because every rule here follows from it
# ----------------------------------------------------------------
# A cache is scoped to the ref that created it. GitHub's rule is that a
# branch may restore its own caches and those of its parent, so:
#
#   * `refs/heads/main` caches are restorable by main and by every PR
#     based on it. These are the ones that matter.
#   * `refs/pull/N/merge` caches are restorable ONLY by re-runs of PR N.
#     Not by main, not by any other PR. So they are dead weight to every
#     build we care about the moment PR N stops being pushed to, and
#     permanently dead once it closes.
#   * `refs/tags/*` caches are restorable only by a run on that same
#     tag, i.e. only by re-running that one release.
#
# What it does
# ------------
# Three sweeps, in increasing order of how obviously dead the entry is.
#
# 1. **Superseded generations.** `Swatinem/rust-cache` keys end in a
#    hash of the dependency set, so a dependency change leaves the
#    previous generation orphaned — still counted against the limit,
#    never read again. Keep only the newest per (ref, job). The
#    `flash-attn-kernels-*` keys have the same shape and get the same
#    treatment.
#
#    **Grouped by REF as well as job, and that is the whole point.**
#    Grouping by job alone put main's cache and a PR's cache for the
#    same job in one bucket and kept whichever was newer — so on
#    2026-09-11 this would have deleted main's 630 MB test cache, which
#    a CI run had restored hours earlier, and kept PR #25's copy that
#    main cannot read. A GC that evicts the live cache to preserve an
#    unreachable one is worse than no GC at all.
#
# 2. **Caches for closed pull requests.** Unreachable by anything, for
#    ever, and nothing else in this repository reclaims them. This is
#    where the 2.80 GB came from.
#
# 3. **Caches for superseded tags.** `release.yml` already prunes these
#    at the end of every release and deliberately keeps the tag it just
#    built, for the re-run case. This is the belt to that braces: a
#    release that never reached its final job leaves them behind.
#
# Deliberately conservative:
#   * Only `v0-rust-*` and `flash-attn-kernels-*` keys are considered
#     for sweep 1 — both ours, both ending in a content hash. Anything
#     else (the Vulkan SDK cache, the CUDA toolkit cache) is left alone.
#   * Sweep 1 deletes a cache ONLY when a strictly newer one exists for
#     the same (ref, job). A single generation is never touched, so it
#     can never delete the current cache.
#   * The tag sweep never touches the newest tag by creation date.
#   * Deletion is BY ID, never by key. Keys are not unique: the same
#     rust-cache key existed twice on 2026-09-11, on two different
#     pull-request refs, and `gh cache delete <key>` cannot say which
#     one it means.
#   * Deleting is safe even if wrong: the worst case is one cold build.
#
# Nothing here is load-bearing for correctness — if it never ran, the
# repo would simply drift back toward the cap.
####################################################################

name: Cache GC

on:
  schedule:
    # Daily. The cap is only approached over several pushes, so this does
    # not need to chase every run.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  actions: write # required to delete caches
  contents: read
  pull-requests: read # required to tell an open PR from a closed one

concurrency:
  group: cache-gc
  cancel-in-progress: false

jobs:
  gc:
    name: Prune unreachable and superseded caches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prune caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `gh cache list` does not expose the ref, and the ref is what every
          # rule below turns on, so go to the REST API directly. `id` comes with
          # it, which is also what we must delete by — keys are not unique
          # across refs.
          gh api --paginate "repos/${GH_REPO}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [(.id|tostring), .ref, (.size_in_bytes|tostring), .created_at, .key] | @tsv' \
            > caches.tsv || true

          if [ ! -s caches.tsv ]; then
            echo "No caches listed — nothing to do."
            exit 0
          fi

          before=$(awk -F'\t' '{s+=$3} END {printf "%.2f", s/1073741824}' caches.tsv)
          echo "Cache total before: ${before} GB across $(wc -l < caches.tsv) entries"
          echo

          # Which pull requests are still open? Anything else with a
          # `refs/pull/N/merge` ref is unreachable for ever.
          gh pr list --state open --limit 200 --json number \
            --jq '.[].number' > open_prs.txt || true
          echo "Open pull requests: $(tr '\n' ' ' < open_prs.txt)"
          echo

          python3 - <<'PY' > to_delete.tsv
          import csv, os, re

          rows = list(csv.reader(open("caches.tsv"), delimiter="\t"))
          open_prs = set()
          if os.path.exists("open_prs.txt"):
              open_prs = {l.strip() for l in open("open_prs.txt") if l.strip()}

          OURS = ("v0-rust-", "flash-attn-kernels-")
          doomed = {}  # id -> (size, ref, key, reason)

          def mark(cid, size, ref, key, reason):
              doomed.setdefault(cid, (size, ref, key, reason))

          # Sweep 2: every cache belonging to a pull request that is not open.
          for cid, ref, size, created, key in rows:
              m = re.fullmatch(r"refs/pull/(\d+)/merge", ref)
              if m and m.group(1) not in open_prs:
                  mark(cid, int(size), ref, key, f"PR #{m.group(1)} is closed")

          # Sweep 3: tag caches other than the newest tag's. `release.yml`
          # normally does this and keeps the tag it just built; replicate that
          # choice here rather than fighting it.
          tags = {}
          for cid, ref, size, created, key in rows:
              m = re.match(r"refs/(?:heads/)?refs/tags/(.+)$|refs/tags/(.+)$", ref)
              if m:
                  tags.setdefault(m.group(1) or m.group(2), []).append(created)
          if tags:
              newest_tag = max(tags, key=lambda t: max(tags[t]))
              for cid, ref, size, created, key in rows:
                  m = re.match(r"refs/(?:heads/)?refs/tags/(.+)$|refs/tags/(.+)$", ref)
                  if m and (m.group(1) or m.group(2)) != newest_tag:
                      mark(cid, int(size), ref, key, "superseded tag")

          # Sweep 1: superseded generations, grouped by (REF, job). The ref is
          # part of the key here deliberately — see the header.
          groups = {}
          for cid, ref, size, created, key in rows:
              if not key.startswith(OURS):
                  continue  # not one of ours — leave it alone
              job = key.rsplit("-", 1)[0]  # drop rust-cache's dependency hash
              groups.setdefault((ref, job), []).append((created, cid, int(size), key))
          for (ref, job), entries in groups.items():
              if len(entries) < 2:
                  continue  # only one generation: never delete the current cache
              entries.sort(reverse=True)  # newest created_at first
              for _created, cid, size, key in entries[1:]:
                  mark(cid, size, ref, key, "superseded generation")

          for cid, (size, ref, key, reason) in doomed.items():
              print(f"{cid}\t{size}\t{ref}\t{reason}\t{key}")
          PY

          if [ ! -s to_delete.tsv ]; then
            echo "Nothing unreachable or superseded. Nothing to prune."
            exit 0
          fi

          freed=$(awk -F'\t' '{s+=$2} END {printf "%.2f", s/1073741824}' to_delete.tsv)
          echo "Pruning $(wc -l < to_delete.tsv) entries (${freed} GB):"
          while IFS=$'\t' read -r id size ref reason key; do
            printf '  - %6d MiB  %-28s %-22s %s\n' "$((size/1024/1024))" "$ref" "$reason" "$key"
            # A cache can vanish between listing and deleting (GitHub's own
            # sweep, a concurrent run). That is the outcome we wanted anyway,
            # so it must not fail the job.
            gh api -X DELETE "repos/${GH_REPO}/actions/caches/${id}" >/dev/null 2>&1 \
              || echo "      (already gone)"
          done < to_delete.tsv

          echo
          echo "Freed approximately ${freed} GB."
