####################################################################
# Populate the release build caches on the DEFAULT BRANCH.
#
# Why this workflow exists
# ------------------------
# `release.yml` only runs on tag pushes. GitHub scopes Actions caches by
# ref, and per the docs a workflow run "cannot restore caches created for
# different tag names" — while tags CAN read caches from the default
# branch. So a release would write a cache scoped to its own tag that no
# later release could ever read.
#
# Measured effect before this existed: a 1268 MB CUDA dependency cache sat
# on `refs/tags/v0.3.4-alpha`, unreadable by v0.3.5, and every release
# rebuilt candle-kernels + llama.cpp's CUDA kernels from scratch.
#
# This workflow runs the same builds on `main` with the same `shared-key`,
# so the cache lands on `refs/heads/main` where tag runs can restore it.
#
# It is deliberately NOT on every push: the CUDA build is the long pole
# (~1h). It runs when the dependency graph actually changes, weekly to
# stay ahead of cache eviction (GitHub evicts after 7 days unused), and
# on demand.
#
# Failure here never blocks a release — a cold release build is exactly
# the old behaviour.
####################################################################
name: Cache warm

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - ".github/workflows/cache-warm.yml"
      - ".github/workflows/release.yml"
      # The composite action IS the toolchain definition — CUDA, Vulkan, MSVC,
      # LIB, the generator, the cache key. Changing it changes what this
      # workflow builds and what the release restores, so it must trigger a
      # re-warm. Omitting it meant the file that defines everything did not
      # trigger the workflow that validates it: the commit removing a broken
      # step ran nothing at all, and the stale cache would have been handed
      # straight to the next release.
      - ".github/actions/**"
  schedule:
    # Weekly, comfortably inside GitHub's 7-day unused-cache eviction.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never stack hour-long builds; a newer run supersedes an in-flight one.
  group: cache-warm-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  warm:
    name: Warm ${{ matrix.name }}
    # Per-entry, mirroring release.yml. The runner image is part of the cache
    # key, so warming on a different image than the release builds on produces
    # a cache the release can never restore — and the CUDA repo we install from
    # is `ubuntu2204`, whose nsight-systems dependency (libtinfo5) is not
    # installable on 24.04 at all.
    runs-on: ${{ matrix.runner }}
    # Raised from 120 when flash-attention-2 entered the `cuda` and
    # `windows-gpu` features. candle-flash-attn's build script asks for only
    # HALF the runner's threads (`thread_percentage(0.5)`, not passable through
    # its API), which the run log confirms as "Using 2 threads" on a 4-vCPU
    # runner.
    #
    # MEASURED on the first cold run after the change (run 31150878312,
    # 2026-08-07), both cells compiling all 19 kernels from scratch:
    #   Linux x86_64 CUDA   76 min
    #   Windows x86_64 GPU  66 min
    #
    # So 120 would in fact still have been enough for the SHIPPED kernel set —
    # the pre-push estimate of ~2.5 h was extrapolated from the full 37-kernel
    # matrix and is wrong for the 19 we vendor (see vendor/candle-flash-attn).
    # The headroom is kept deliberately anyway, because the cost of being wrong
    # is asymmetric: a too-low timeout saves NO cache, so every later release
    # rebuilds cold and still succeeds — slower by an hour, with nothing failing
    # to draw attention to it. Cheap insurance against a silent regression, not
    # a prediction that the job needs 5.5 hours.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          # The long pole, and the whole reason this workflow exists.
          - name: Linux x86_64 CUDA
            rustflags: "-C target-cpu=x86-64-v3"
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: "--features cuda"
            cuda_linux: true
          # Cheap by comparison, but the same ref-scoping problem applies.
          # Must mirror release.yml's ubuntu-22.04 pin: the runner image is part
          # of the rust-cache key, so warming on 24.04 would build a cache the
          # 22.04 release build can never restore (and 22.04 is what makes the
          # CPU binary run on Debian 12 — see the release.yml comment).
          - name: Linux x86_64
            rustflags: "-C target-cpu=x86-64-v3"
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: ""
            cuda_linux: false
          # Windows GPU — the SECOND long pole. Before this cell existed, the
          # Windows-GPU release rebuilt llama.cpp's Vulkan backend AND
          # candle-kernels' CUDA PTX cold every single release (~30 min), while
          # the Linux CUDA build already restored a warm cache from this
          # workflow. This cell warms the identical `shared-key` the release
          # restores. Every setup step + build env below mirrors release.yml's
          # Windows-GPU cell byte-for-byte, or the key diverges and the release
          # gets no hit. Runner image (windows-2022) is part of the key too.
          - name: Windows x86_64 GPU
            rustflags: "-C target-cpu=x86-64-v3"
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            features: "--features windows-gpu"
            cuda_linux: false
            cuda_windows: true
            vulkan: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: GPU build environment (toolchain + cache — single definition)
        uses: ./.github/actions/gpu-build-env
        with:
          target: ${{ matrix.target }}
          features: ${{ matrix.features }}
          cuda-linux: ${{ matrix.cuda_linux || false }}
          cuda-windows: ${{ matrix.cuda_windows || false }}
          vulkan: ${{ matrix.vulkan || false }}
      - name: Build (populates the dependency cache)
        run: cargo build --locked --release ${{ matrix.features }}
        env:
          # MUST match release.yml's build env exactly (compute cap AND arch
          # list), or the warmed cache has a different key than the release
          # build restores. See release.yml for the rationale behind 80 + list.
          # CUDA_COMPUTE_CAP applies to BOTH CUDA builds (candle floor); the
          # CMAKE arch list is llama.cpp-CUDA (Linux `cuda` only — Windows GPU
          # uses the Vulkan backend, so it stays empty there).
          CUDA_COMPUTE_CAP: ${{ (matrix.cuda_linux || matrix.cuda_windows) && '80' || '' }}
          CMAKE_CUDA_ARCHITECTURES: ${{ matrix.cuda_linux && '61-real;75-real;80-real;86-real;89-real;90-real;120-real;120-virtual' || '' }}
          # Must equal the release matrix's rustflags for the SAME cell.
          # RUSTFLAGS is part of both the rust-cache key (Swatinem hashes RUST*)
          # and cargo's own fingerprint, so warming with a different value
          # produces a cache the release can never restore AND a rebuild cargo
          # would redo anyway. Adding `-C target-cpu=x86-64-v3` to release.yml
          # in v0.3.79 without mirroring it here took the CUDA release build
          # from 12 minutes to 78.
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
