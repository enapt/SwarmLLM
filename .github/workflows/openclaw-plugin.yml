name: OpenClaw plugin

# The provider plugin under integrations/openclaw is TypeScript with its own
# tests (vitest) and typecheck; nothing in the Rust CI compiles it. Path-filtered
# so it runs only when the plugin or this file changes — installing its dev
# dependencies pulls the openclaw package (~200 MB), which is not worth paying
# on every Rust push.
on:
  push:
    branches: [main]
    paths:
      - "integrations/openclaw/**"
      - ".github/workflows/openclaw-plugin.yml"
  pull_request:
    paths:
      - "integrations/openclaw/**"
      - ".github/workflows/openclaw-plugin.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/openclaw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
