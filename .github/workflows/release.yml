name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Needed by the `prune-caches` job below to delete tag-scoped caches.
  actions: write

env:
  CARGO_TERM_COLOR: always
  # Override `.cargo/config.toml`'s `target-cpu=native`. Runner CPU features
  # drift from default target baselines and trip feature-detection asserts
  # in deps (e.g. `ring` 0.17.14 on aarch64-apple-darwin). Release binaries
  # must be portable regardless, so always compile to the default target.
  RUSTFLAGS: ""
  # Opt in to Node.js 24 for JS-based actions (checkout, softprops/gh-release,
  # ...) ahead of the June 2026 deprecation cutoff. Silences Node 20 warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Pre-create the draft release so each build job can attach assets to it
  # directly via `gh release upload`, bypassing actions/upload-artifact
  # (which shares the Actions storage quota). Release assets are stored
  # against the repo's release storage quota instead, which is not the
  # same pool that artifact storage saturates.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Build jobs upload with --clobber, so an existing release is fine.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — build jobs will append/clobber assets"
          else
            # Deliberately NOT marking alpha tags as prereleases.
            #
            # Every release this project ships is tagged `-alpha`, so doing so
            # marked EVERY release a prerelease — and GitHub's
            # `/releases/latest` skips those. That endpoint is what nodes older
            # than v0.3.44 poll, so they would see nothing at all and strand on
            # whatever they were running. It also leaves the newest release
            # unlabelled as "Latest" for anyone browsing.
            #
            # Every release from v0.3.62 to v0.3.68 was flipped back to
            # non-prerelease by hand afterwards, which is a manual step that
            # will eventually be forgotten. The convention IS non-prerelease, so
            # the automation should match it.
            PRERELEASE=
            # Use this version's CHANGELOG section as the release body. Without
            # it the release carries only GitHub's auto-generated commit list,
            # so the people deciding whether to update — including everyone
            # reading the Discord feed — see a compare link and nothing about
            # what changed or whether it affects them (reported 2026-07-28).
            VERSION="${TAG#v}"
            NOTES_FILE=$(mktemp)
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { found = 1; next }
              found && /^## \[/        { exit }
              found                    { print }
            ' CHANGELOG.md > "$NOTES_FILE"

            if [ -s "$NOTES_FILE" ]; then
              printf '\n---\n\nFull commit list: https://github.com/%s/compare/...%s\n' \
                "$GITHUB_REPOSITORY" "$TAG" >> "$NOTES_FILE"
              gh release create "$TAG" \
                --draft \
                --title "$TAG" \
                --notes-file "$NOTES_FILE" \
                $PRERELEASE
            else
              echo "No CHANGELOG section for $VERSION — falling back to generated notes"
              gh release create "$TAG" \
                --draft \
                --title "$TAG" \
                --generate-notes \
                $PRERELEASE
            fi
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to ubuntu-22.04 (glibc 2.35), NOT ubuntu-latest. A glibc
          # binary requires the runtime glibc to be at least as new as the one
          # it was built against, and `ubuntu-latest` is now 24.04 (glibc 2.39).
          # A 2.39-linked binary refuses to start on anything older — Debian 12
          # ships 2.36, so the prebuilt CPU binary failed there and users had to
          # compile from source (external report, 2026-07-23). 2.35 runs on
          # Debian 12, Ubuntu 22.04+, and every current mainstream distro; 20.04
          # (2.31) would reach further but GitHub is retiring that runner image.
          # Keep in step with the CUDA entry below, which already pins 22.04.
          - name: Linux x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: swarmllm
            archive: swarmllm-linux-x86_64.tar.gz
            bare_asset: swarmllm-linux-x86_64
            features: ""
            rustflags: "-C target-cpu=x86-64-v3"

          # Processors older than AVX2 (pre-Haswell 2013 / pre-Excavator 2015)
          # cannot execute the assets above and would die on their first
          # instruction. These two are built with no raised baseline so those
          # machines have something that runs. `update.rs::host_asset_name`
          # sends them here, and SKIPS the update entirely rather than install
          # an unrunnable binary if the asset is absent.
          #
          # There is deliberately no CUDA/GPU baseline: a pre-2013 processor
          # paired with a modern GPU is vanishingly rare, and such a host stops
          # updating with a message rather than being handed something broken.
          - name: Linux x86_64 baseline
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: swarmllm
            archive: swarmllm-linux-x86_64-baseline.tar.gz
            bare_asset: swarmllm-linux-x86_64-baseline
            features: ""

          - name: Windows x86_64 baseline
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            archive: swarmllm-windows-x86_64-baseline.zip
            bare_asset: swarmllm-windows-x86_64-baseline.exe
            features: ""
            windows: true

          - name: Linux x86_64 CUDA
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: swarmllm
            archive: swarmllm-linux-x86_64-cuda.tar.gz
            bare_asset: swarmllm-linux-x86_64-cuda
            features: "--features cuda"
            rustflags: "-C target-cpu=x86-64-v3"
            cuda_linux: true

          - name: macOS aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: swarmllm
            archive: swarmllm-macos-aarch64.tar.gz
            bare_asset: swarmllm-macos-aarch64
            features: ""

          # Windows CPU: works on any Windows PC, no GPU drivers required.
          # Pinned to windows-2022 (not windows-latest) to avoid monthly image
          # MSVC toolchain churn breaking the build unexpectedly.
          - name: Windows x86_64 CPU
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            archive: swarmllm-windows-x86_64-cpu.zip
            bare_asset: swarmllm-windows-x86_64.exe
            features: ""
            rustflags: "-C target-cpu=x86-64-v3"
            windows: true

          # Windows GPU: llama.cpp Vulkan (all GPU vendors, local inference) +
          #              candle CUDA via dynamic-loading (NVIDIA, split inference).
          # The archive bundles NVIDIA CUDA redist DLLs next to swarmllm-gpu.exe
          # so end users need only the NVIDIA display driver (no CUDA Toolkit).
          - name: Windows x86_64 GPU
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            archive: swarmllm-windows-x86_64-gpu.zip
            bare_asset: swarmllm-windows-x86_64-gpu.exe
            features: "--features windows-gpu"
            rustflags: "-C target-cpu=x86-64-v3"
            windows: true
            windows_gpu: true
            cuda_windows: true
            vulkan: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: GPU build environment (toolchain + cache — single definition)
        uses: ./.github/actions/gpu-build-env
        with:
          target: ${{ matrix.target }}
          features: ${{ matrix.features }}
          cuda-linux: ${{ matrix.cuda_linux || false }}
          cuda-windows: ${{ matrix.cuda_windows || false }}
          vulkan: ${{ matrix.vulkan || false }}
      - name: Build release binary
        run: cargo build --locked --release ${{ matrix.features }}
        env:
          # Overrides the workflow-level RUSTFLAGS: "" for the AVX2 variant
          # only. Everything else keeps the portable baseline.
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
          # candle floor. candle-kernels emits PTX for `compute_NN`; the driver
          # JIT-compiles it to the user's actual GPU at runtime, so this is a
          # *minimum* arch, and every GPU at or above it is covered — including
          # newer ones (Ada, Hopper, Blackwell/RTX 50) via forward-compatible
          # JIT. 75 (Turing) is the floor: it brings in RTX 20-series + GTX 16
          # that 80 (Ampere) silently excluded — a large slice of the home/gamer
          # audience. candle-kernels disables its bf16-WMMA kernels below sm_80,
          # which costs nothing for SwarmLLM's quantized GGUF path (that uses the
          # quantized kernels, not bf16 WMMA); recovering that for Ampere+ would
          # need a second compute_80 variant + runtime compute-cap selection —
          # tracked in docs/FUTURE_WORK.md. Must be set for any CUDA build —
          # empty panics bindgen_cuda with `ParseIntError { kind: Empty }`.
          CUDA_COMPUTE_CAP: ${{ (matrix.cuda_linux || matrix.cuda_windows) && '75' || '' }}
          # llama.cpp CUDA backend (Linux `cuda` feature only — Windows GPU uses
          # the Vulkan backend). Native SASS for Pascal→Blackwell + compute_120
          # PTX so a future post-Blackwell card still runs via driver JIT. Native
          # `120-real` needs CUDA 12.8 (nvcc ≥ 12.8 is the first to know sm_120);
          # research shows the compute_90-PTX-JIT path is up to ~5× slower on the
          # llama.cpp/cuBLAS Blackwell path, which native SASS avoids.
          CMAKE_CUDA_ARCHITECTURES: ${{ matrix.cuda_linux && '61-real;75-real;80-real;86-real;89-real;90-real;120-real;120-virtual' || '' }}

      - name: Package archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ls -la "target/release/${{ matrix.binary }}"
          mkdir -p staging
          cp "target/release/${{ matrix.binary }}" staging/
          cp config/default.toml staging/
          cp INSTALL.txt staging/
          cp LICENSE-MIT LICENSE-APACHE staging/
          ls -la staging/
          tar -C staging -czf "${{ matrix.archive }}" .
          ls -la "${{ matrix.archive }}"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Archive layout: one swarmllm.exe (the main binary for this variant)
          # + config + docs. The GPU archive additionally bundles NVIDIA CUDA
          # redist DLLs (see the cuda_windows block below). The launcher
          # (swarmllm-launcher.exe) is reserved for the Windows installer
          # which ships both CPU and GPU variants side-by-side — for a
          # single-variant archive it is redundant.
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target\release\swarmllm.exe" "staging\swarmllm.exe"
          Copy-Item "config\default.toml" staging\
          Copy-Item "INSTALL.txt" staging\
          Copy-Item LICENSE-* staging\
          # Windows GPU: bundle NVIDIA CUDA redist DLLs next to swarmllm-gpu.exe.
          # cudarc uses LoadLibraryW at runtime (dynamic-loading feature) to
          # find these — placing them in the same directory as the .exe lets
          # Windows' standard DLL search path resolve them without requiring
          # CUDA Toolkit installation on the end-user machine.
          # See NOTICE-NVIDIA-CUDA.txt for CUDA EULA §2.6 redistribution notice.
          if ("${{ matrix.windows_gpu }}" -eq "true") {
            $cudaBin = "$env:CUDA_PATH\bin"
            $dlls = @("cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll",
                     "curand64_*.dll", "nvrtc64_*.dll", "nvrtc-builtins64_*.dll")
            foreach ($pat in $dlls) {
              Get-ChildItem "$cudaBin\$pat" | ForEach-Object { Copy-Item $_.FullName staging\ }
            }
            Copy-Item "NOTICE-NVIDIA-CUDA.txt" staging\
            Write-Host "Bundled CUDA redist DLLs:"
            Get-ChildItem "staging\*.dll" | Select-Object Name, Length | Format-Table
          }
          Compress-Archive -Path staging\* -DestinationPath ${{ matrix.archive }}

      - name: Upload archive to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub's release-asset upload endpoint intermittently returns
          # 5xx (observed 502 Bad Gateway on the v0.2.0-alpha third-attempt
          # run for the Linux CUDA archive — the build succeeded, the
          # upload flaked, and the whole release job got marked failed).
          # `gh release upload` doesn't auto-retry 5xx, so wrap with three
          # attempts at 15s/30s back-off.
          for i in 1 2 3; do
            if gh release upload "${GITHUB_REF_NAME}" "${{ matrix.archive }}" --clobber; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "Release upload failed after 3 attempts" >&2
              exit 1
            fi
            echo "Upload attempt $i failed; retrying after $((i * 15))s" >&2
            sleep $((i * 15))
          done

      # Bare-binary asset + SHA256 sidecar for in-app auto-update (src/update.rs).
      # The asset name is `matrix.bare_asset` and MUST equal what
      # `update.rs::update_asset_name()` builds for that variant:
      #   linux/macos: swarmllm-{os}-{arch}{variant}
      #   windows:     swarmllm-{os}-{arch}{variant}.exe
      # where {variant} is "" for CPU, "-cuda" for --features cuda, and "-gpu"
      # for --features windows-gpu. The `.sha256` sidecar is mandatory —
      # update.rs rejects a download that has none.
      #
      # Every variant gets one, GPU included. Publishing only the CPU binaries
      # did not mean "GPU users can't auto-update"; it meant a GPU node matched
      # the same-(os, arch) CPU asset and quietly replaced its own GPU build
      # with a CPU one.
      - name: Publish bare binary + sha256 (Linux/macOS)
        if: matrix.bare_asset != '' && runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BARE="${{ matrix.bare_asset }}"
          cp "target/release/${{ matrix.binary }}" "$BARE"
          shasum -a 256 "$BARE" > "${BARE}.sha256"
          # See "Upload archive to release" for the retry rationale.
          for i in 1 2 3; do
            if gh release upload "${GITHUB_REF_NAME}" "$BARE" "${BARE}.sha256" --clobber; then
              break
            fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep $((i * 15))
          done

      - name: Publish bare binary + sha256 (Windows)
        if: matrix.bare_asset != '' && runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bare = "${{ matrix.bare_asset }}"
          Copy-Item "target\release\swarmllm.exe" $bare
          # PowerShell Get-FileHash → "<hash>  <filename>" two-space delimiter
          # matches the `shasum -a 256` format on Linux/macOS, which update.rs's
          # checksum parser already handles via `split_whitespace().next()`.
          $hash = (Get-FileHash $bare -Algorithm SHA256).Hash.ToLower()
          "$hash  $bare" | Out-File -Encoding ascii -NoNewline "${bare}.sha256"
          # See "Upload archive to release" for the retry rationale.
          for ($i = 1; $i -le 3; $i++) {
            gh release upload "${env:GITHUB_REF_NAME}" $bare "${bare}.sha256" --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { exit 1 }
            Start-Sleep -Seconds ($i * 15)
          }

      # .deb package (Linux CPU only)
      - name: Build and upload .deb
        if: matrix.name == 'Linux x86_64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo install cargo-deb --locked 2>/dev/null || true
          cargo deb --no-build
          # GITHUB_REF_NAME is "v0.1.0" but cargo-deb names the file
          # "swarmllm_0.1.0_amd64.deb" (Debian policy disallows "v" in
          # version strings). Strip the leading "v" so our upload name
          # matches the produced artifact convention.
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="swarmllm_${VERSION}_amd64.deb"
          cp target/debian/*.deb "$DEB"
          # See "Upload archive to release" for the retry rationale.
          for i in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" "$DEB" --clobber; then
              break
            fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep $((i * 15))
          done

      # .rpm package (Linux CPU only)
      - name: Build and upload .rpm
        if: matrix.name == 'Linux x86_64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo install cargo-generate-rpm --locked 2>/dev/null || true
          # RPM Version fields disallow `-`, which Cargo's SemVer
          # pre-release syntax uses (e.g. `0.2.0-alpha`). RPM convention
          # uses `~` for prerelease markers (sorts BEFORE the
          # corresponding release version: 0.2.0~alpha < 0.2.0). Map
          # `-` → `~` for cargo-generate-rpm's --set-metadata override
          # without touching Cargo.toml. Stable releases (`0.2.0`) are a
          # no-op for the substitution.
          #
          # NOTE: do NOT use bash's `${var//-/~}` parameter expansion —
          # the replacement string undergoes tilde expansion per the
          # bash manual ("string undergoes tilde expansion ..."), so
          # `~` becomes `$HOME` (`/home/runner` on the runner). A
          # previous attempt produced `0.2.0/home/runneralpha`. sed is
          # not subject to bash's tilde-expansion rule, so it's the
          # safe substitution path here.
          CARGO_VERSION=$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)
          RPM_VERSION=$(printf '%s' "$CARGO_VERSION" | sed 's/-/~/g')
          cargo generate-rpm --set-metadata "version = '${RPM_VERSION}'"
          # Filename keeps the SemVer `-` form (tester-facing artefact
          # name; matches the .deb / archive convention).
          VERSION="${GITHUB_REF_NAME#v}"
          RPM="swarmllm_${VERSION}.x86_64.rpm"
          cp target/generate-rpm/*.rpm "$RPM"
          # See "Upload archive to release" for the retry rationale.
          for i in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" "$RPM" --clobber; then
              break
            fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep $((i * 15))
          done

  # Publish the draft release — only if at least one build succeeded. Uses
  # `always() && !cancelled()` so a single-platform failure (e.g. macOS flake)
  # doesn't block shipping the platforms that did build.
  publish:
    name: Publish release
    needs: [create-release, build]
    if: always() && !cancelled() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as published
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # `--repo` lets gh CLI skip `git remote get-url origin` lookup,
          # so we don't need `actions/checkout@v4` on this job.
          # Check for each platform's archive BY NAME, not by counting.
          #
          # A raw count cannot tell "every platform shipped" from "one platform
          # shipped several files". v0.3.56-alpha published with 14 assets and
          # NO Windows GPU binary at all: the Linux cells contribute .tar.gz +
          # bare + .sha256 + .deb + .rpm between them, so the old `>= 5` was
          # satisfied by the platforms that did build while a whole platform
          # was missing. Windows GPU is the cell most likely to be the missing
          # one — it has the most moving parts (CUDA, Vulkan, MSVC, CMake) —
          # and its users are exactly those who cannot fall back to another
          # asset.
          EXPECTED=(
            swarmllm-linux-x86_64.tar.gz
            swarmllm-linux-x86_64-cuda.tar.gz
            swarmllm-macos-aarch64.tar.gz
            swarmllm-windows-x86_64-cpu.zip
            swarmllm-windows-x86_64-gpu.zip
            # The baseline builds are the ONLY thing a pre-AVX2 processor can
            # run: every other asset is compiled for x86-64-v3 and dies on its
            # first instruction there. They qualify under this guard's own test
            # — "its users are exactly those who cannot fall back" — more
            # strongly than anything else here, because for them there is no
            # second choice at all. `update.rs::host_asset_name` skips the
            # update when they are absent, so a release without them silently
            # freezes every old-processor node at its current version.
            swarmllm-linux-x86_64-baseline.tar.gz
            swarmllm-windows-x86_64-baseline.zip
          )
          NAMES=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          MISSING=()
          for want in "${EXPECTED[@]}"; do
            grep -qxF "$want" <<<"$NAMES" || MISSING+=("$want")
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "Refusing to publish $TAG — these platform archives are missing:"
            printf '  %s\n' "${MISSING[@]}"
            echo ""
            echo "The release is left as a DRAFT on purpose. Publishing it would put an"
            echo "incomplete release in front of users, and the auto-updater cannot fall"
            echo "back to another platform's binary. Fix the failing build job and re-run,"
            echo "or publish deliberately by hand if shipping without these is intended."
            exit 1
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false
          echo "Published $TAG with all $(wc -l <<<"$NAMES") asset(s)"

  # Reclaim cache quota from tags that will never restore it again.
  #
  # A cache is scoped to the ref that created it, and GitHub will not serve a
  # cache created for one tag to a run for a different tag. So every release
  # leaves ~0.8 GB behind that is, by GitHub's own scoping rules, permanently
  # unreachable — while the repository quota is a hard 10 GB that evicts
  # least-recently-used entries once exceeded.
  #
  # Measured 2026-07-31: 3.22 GB of a 9.69 GB total — a third of the quota —
  # was dead tag cache from four past releases, crowding out the live caches
  # the builds actually restore. That is a direct cause of "why was this build
  # cold": not compile cost, but eviction pressure from garbage.
  #
  # The CURRENT tag is deliberately kept. Re-running a release to fix one
  # failed platform is precisely when a warm cache matters most, and that is
  # not a hypothetical — v0.3.56-alpha needed exactly that.
  prune-caches:
    name: Prune caches from older tags
    needs: publish
    # Runs even if publish refused, so a failed release still tidies up.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Delete tag-scoped caches from previous tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Keeping caches for $KEEP; pruning other tag-scoped caches."
          freed=0
          while read -r id ref size; do
            [ -z "${id:-}" ] && continue
            case "$ref" in
              *"refs/tags/$KEEP") echo "  keep  $ref"; continue ;;
              *refs/tags/*) ;;
              *) continue ;;
            esac
            if gh api -X DELETE "repos/$REPO/actions/caches/$id" >/dev/null 2>&1; then
              echo "  prune $ref ($((size/1024/1024)) MiB)"
              freed=$((freed + size))
            fi
          done < <(gh api "repos/$REPO/actions/caches?per_page=100" \
                     --jq '.actions_caches[] | "\(.id) \(.ref) \(.size_in_bytes)"')
          echo "Reclaimed $((freed/1024/1024)) MiB of cache quota."
