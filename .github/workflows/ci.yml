name: CI

on:
  # Run on PRs (if any) but NOT on direct pushes to main — local pre-push hooks
  # (cargo fmt + cargo clippy) already enforce quality before every commit.
  # Trigger manually via GitHub Actions UI or gh CLI: gh workflow run ci.yml
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Override `.cargo/config.toml`'s `target-cpu=native` — CI builds must be
  # portable and survive deps like `ring` 0.17.14 whose static feature
  # asserts trip when native CPU flags leak in on aarch64-apple-darwin.
  RUSTFLAGS: ""
  # Opt in to Node.js 24 for JS-based actions ahead of June 2026 deprecation.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy (${{ matrix.os }} / ${{ matrix.features }})
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Lint both default and dev+claude-subscription feature sets on
        # Linux. macOS only lints the default feature set — the dev/claude
        # paths are platform-agnostic, so the redundancy across OSes isn't
        # worth doubling the macOS minute spend.
        include:
          - os: ubuntu-latest
            features: "default"
            flags: ""
          - os: ubuntu-latest
            features: "dev,claude-subscription"
            flags: "--no-default-features --features dev,claude-subscription"
          - os: macos-15
            features: "default"
            flags: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: clippy-${{ matrix.os }}-${{ matrix.features }}
      - run: cargo clippy ${{ matrix.flags }} --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: test-${{ matrix.os }}
      - name: Run unit tests
        run: cargo test --lib --bins
      - name: Run unit tests (dev,claude-subscription features)
        run: cargo test --no-default-features --features dev,claude-subscription --lib --bins
      # Integration tests use multi-process spawning + named-pipe IPC that
      # has been validated on Linux + Windows but not exercised on macOS.
      # Run them only on Linux until we catch the first failure on macOS
      # and decide whether to fix or skip-list per test.
      - name: Run integration tests (Linux only)
        if: runner.os == 'Linux'
        run: cargo test --test integration -- --test-threads=1
      - name: Run phase 10/11 integration tests (Linux only)
        if: runner.os == 'Linux'
        run: cargo test --test integration_phase10_11 -- --test-threads=1
      # yamux_substream tests use TCP/QUIC transport only (no named-pipe IPC),
      # so they're safe to run on macOS — the Linux-only guard was copy-pasted
      # from the multi-process integration tests above.
      - name: Run yamux substream tests
        run: cargo test --test yamux_substream

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.os }}
      - run: cargo build --release

  # Compile-check feature paths that aren't covered by the main test/build
  # matrix. Uses `cargo check` (not test or build) because CUDA codegen
  # requires nvcc + CUDA libs which aren't on stock GitHub runners — but
  # cudarc with `dynamic-loading` only dlopens at runtime, so `check`
  # succeeds without CUDA installed and will catch any compile error in
  # `cfg(feature = "candle-cuda")` code paths before a release tag.
  feature-check:
    name: Feature compile-check (${{ matrix.features }})
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: "candle-cuda"
            flags: "--no-default-features --features candle-cuda"
          - features: "windows-gpu"
            flags: "--no-default-features --features windows-gpu"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: feature-check-${{ matrix.features }}
      - run: cargo check ${{ matrix.flags }} --all-targets
