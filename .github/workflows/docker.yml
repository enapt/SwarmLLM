name: Docker

# Images are published when a release is PUBLISHED — i.e. when
# `examples/sign_release.sh` un-drafts it after signing — never on a tag push.
#
# A tag is step 7a of the release gate, not a release: the draft it produces is
# verified on the downloaded artifact and only then signed and published. This
# workflow used to run on the tag, so every tag was a Docker release at once —
# no gate, no signature — and `latest` moved with it. That published the
# WITHDRAWN v0.3.199-alpha (garbage on every GPU model) and the never-signed
# .202 and .203 drafts, and a container node that pulled `latest` in the ~10 h
# between the .203 and .204 tags came up on an unsigned build (2026-09-24).
#
# `published` fires on the draft → published edit. The script runs `gh` with
# the maintainer's own credentials; an edit made with a workflow's
# GITHUB_TOKEN would NOT start this workflow, so do not move the un-drafting
# into a workflow without replacing this trigger. On a release event
# `github.ref` is `refs/tags/<tag>`, which is what metadata-action's
# `type=semver` reads (it tests the ref, not the event name).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag for a manual build (e.g., dev). `latest` comes only from a published release."
        required: false
        default: "dev"

# Two image builds per run; a rapid second push would run both again for
# nothing. Superseding is right here — only the newest commit's images matter.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-cpu:
    name: Build CPU Image
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # `github.repository` preserves the repo's capitalisation (enapt/SwarmLLM),
      # but a registry reference must be lowercase. The `tags:` below are fine
      # because metadata-action lowercases for us; a hand-written cache ref is
      # not, and buildx rejects the whole build rather than skipping the cache.
      - name: Lowercase image name for registry refs
        run: echo "IMAGE_LC=${GH_REPO,,}" >> "$GITHUB_ENV"
        env:
          GH_REPO: ${{ github.repository }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` follows a PUBLISHED release and nothing else. It is not
          # guarded by {{is_default_branch}}: that is never true when the ref is
          # a tag, which is how no release published `latest` at all until
          # 2026-08-16. It IS guarded by the event, because a manual dispatch
          # builds whatever ref it was started on — usually `main`, i.e.
          # unreleased code — and must never become the image people pull.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ github.event.inputs.tag || '' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push CPU image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache in the registry, not the Actions cache.
          #
          # `type=gha` shares one 10 GB pool with every other cache in the
          # repo, and these two image builds were consuming 3.33 GB of it —
          # enough to evict the release job's 1.23 GB CUDA dependency cache
          # by LRU. When that happens the Linux CUDA release build goes from
          # ~10 minutes to ~59. The registry backend has no such limit and
          # lives next to the images it caches for.
          #
          # Scoped per variant: an unscoped cache is a single ref, so the CPU
          # and CUDA builds were overwriting each other's entries and each
          # rebuilding what the other had just evicted.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:buildcache-cpu
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:buildcache-cpu,mode=max
          platforms: linux/amd64

  build-cuda:
    name: Build CUDA Image
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # `github.repository` preserves the repo's capitalisation (enapt/SwarmLLM),
      # but a registry reference must be lowercase. The `tags:` below are fine
      # because metadata-action lowercases for us; a hand-written cache ref is
      # not, and buildx rejects the whole build rather than skipping the cache.
      - name: Lowercase image name for registry refs
        run: echo "IMAGE_LC=${GH_REPO,,}" >> "$GITHUB_ENV"
        env:
          GH_REPO: ${{ github.repository }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The -cuda suffix applies to raw tags too, so `latest` here becomes
          # `latest-cuda` — which is why latest is a raw tag rather than the
          # flavor `latest=true` option (that one is never suffixed).
          flavor: |
            suffix=-cuda
          # See the CPU job for why `latest` has no enable= guard.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ github.event.inputs.tag || '' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push CUDA image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.cuda
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # See the CPU build for why this is registry-backed and scoped.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:buildcache-cuda
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:buildcache-cuda,mode=max
          platforms: linux/amd64
