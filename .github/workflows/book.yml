# Build and deploy the mdBook documentation site to GitHub Pages.
#
# Triggers on changes under `docs/book/` (or this workflow itself), and on
# manual dispatch. The published URL will be
# https://enapt.github.io/SwarmLLM/ once Pages is enabled with
# `Settings → Pages → Source: GitHub Actions`.
name: Deploy book

on:
  push:
    branches: [main]
    paths:
      - 'docs/book/**'
      - '.github/workflows/book.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping queued ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mdBook
        env:
          MDBOOK_VERSION: 0.4.40
          # SEC: SHA256 of mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz
          # from https://github.com/rust-lang/mdBook/releases/tag/v0.4.40.
          # The Pages job carries `id-token: write`, so a tarball swap on
          # GitHub Releases (or its CDN) would let an attacker run code
          # with that token. Verify before extracting.
          MDBOOK_SHA256: 9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  /tmp/mdbook.tar.gz" | sha256sum -c -
          tar -xz -C "$HOME/.local/bin" -f /tmp/mdbook.tar.gz
          rm -f /tmp/mdbook.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build book
        working-directory: docs/book
        run: mdbook build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # `book.toml` sets `build-dir = "../../target/book"`, which from
          # `docs/book/` resolves to `target/book` at the repo root.
          path: target/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
