# Build and deploy the mdBook documentation site to GitHub Pages.
#
# Triggers on changes under `docs/book/` (or this workflow itself), and on
# manual dispatch. The published URL will be
# https://enapt.github.io/SwarmLLM/ once Pages is enabled with
# `Settings → Pages → Source: GitHub Actions`.
name: Deploy book

on:
  push:
    branches: [main]
    paths:
      - 'docs/book/**'
      - '.github/workflows/book.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping queued ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        env:
          MDBOOK_VERSION: 0.4.40
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build book
        working-directory: docs/book
        run: mdbook build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # `book.toml` sets `build-dir = "../../target/book"`, which from
          # `docs/book/` resolves to `target/book` at the repo root.
          path: target/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
