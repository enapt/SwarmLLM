version: 2
updates:
  # GitHub Actions are pinned by commit SHA in workflow files. Dependabot
  # opens PRs that bump those SHAs while keeping the trailing tag comment
  # in sync. Without this config a compromised third-party action that
  # mutates its tag could ship malicious code into release builds.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  # SEC: also surface cargo dep updates so we get yanked-version /
  # unmaintained-crate alerts that `cargo audit` doesn't catch. Auto-merge
  # is intentionally NOT enabled — a malicious semver-compatible bump
  # (typosquat / takeover) is the precise supply-chain vector to defend
  # against, so all PRs require human review before merge.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
