# SwarmLLM anchor node — bootstrap / relay only, no inference.
# Full guide: https://github.com/enapt/SwarmLLM/blob/main/docs/NETWORKING.md
#
# The setup script rewrites `external_address` below with your DuckDNS hostname.

[node]
data_dir = "/var/lib/swarmllm"
listen_port = 8800          # dashboard/API on TCP 8800 (loopback only in anchor mode)
                            # P2P: TCP 8810 (listen_port + 10) + UDP 8800 (QUIC)
anchor_mode = true          # no inference; no models; dashboard bound to loopback

[network]
enable_relay = true         # serve as a relay for NAT'd peers — the anchor's main job
enable_upnp = false         # a public/forwarded host doesn't need UPnP (it'd just no-op)
# How THIS node is reachable from the internet (the installer rewrites this line).
# No trailing /p2p — the daemon appends its own peer id. TCP port = listen_port+10,
# QUIC on UDP listen_port. A single string also works (external_address = "...").
#   DNS name (readable, portable):  /dns4/YOUR-NAME.duckdns.org/tcp/8810
#   Static IP (VPS, no DNS):        /ip4/203.0.113.5/tcp/8810
# On a VPS whose public IP is on the interface, both TCP + QUIC are auto-advertised
# from the listeners anyway; these entries add the readable name on both transports.
external_addresses = ["/dns4/YOUR-NAME.duckdns.org/tcp/8810", "/dns4/YOUR-NAME.duckdns.org/udp/8800/quic-v1"]

[updates]
# Keep an internet-exposed node patched. SHA256-verified binaries from GitHub.
# "stable" auto-applies stable releases; "disabled" turns it off; "all" includes pre-releases.
auto_update = "stable"
