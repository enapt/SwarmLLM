<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwarmLLM — Chat</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="logo">SwarmLLM</div>
    <nav>
      <a href="/admin">Dashboard</a>
      <a href="/chat" class="active">Chat</a>
    </nav>
    <div class="node-info">
      <span class="mono" id="node-id">...</span>
    </div>
  </header>

  <div class="chat-container">
    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty" id="chat-empty">
        <div class="chat-empty-icon">&#11088;</div>
        <div style="font-size:1.2rem;font-weight:600;color:var(--text-primary)">SwarmLLM Chat</div>
        <div>Send a message to start a conversation</div>
      </div>
    </div>

    <div class="chat-input-area">
      <div class="chat-input-wrap">
        <textarea id="chat-input" placeholder="Type a message..." rows="1"
                  onkeydown="handleInputKey(event)"></textarea>
        <button class="btn btn-primary" id="send-btn" onclick="sendMessage()">Send</button>
      </div>
      <div class="chat-toolbar">
        <select id="model-select" style="display:none">
          <option value="local">local</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="clearChat()">Clear chat</button>
      </div>
    </div>
  </div>

  <script src="/static/js/chat.js"></script>
</body>
</html>
