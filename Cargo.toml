[workspace]
resolver = "2"
members = [".", "crates/swarmllm-frontend", "crates/swarmllm-types"]
exclude = [
    "vendor/candle-flash-attn",
    "vendor/candle-paged-attention",
    "vendor/libp2p-request-response",
    "vendor/candle",
    "vendor/float8",
]
# Note: vendor/libp2p-gossipsub was removed in libp2p 0.55→0.56 upgrade —
# upstream libp2p-gossipsub 0.49.4 ships the CVE-2026-33040 + CVE-2026-34219
# fixes our backport carried, so the vendor is no longer needed.

[package]
name = "swarmllm"
version = "0.3.140-alpha"
edition = "2021"
default-run = "swarmllm"
description = "Decentralized peer-to-peer LLM inference network"
license = "MIT OR Apache-2.0"
repository = "https://github.com/enapt/SwarmLLM"
homepage = "https://github.com/enapt/SwarmLLM"
keywords = ["llm", "p2p", "inference", "distributed", "decentralized"]
categories = ["network-programming", "command-line-utilities"]
rust-version = "1.89"

[[bin]]
name = "swarmllm"
path = "src/main.rs"

# Windows launcher: detects GPU at runtime and execs swarmllm-gpu.exe or swarmllm-cpu.exe.
# Built separately and renamed to swarmllm.exe in the Windows installer.
[[bin]]
name = "swarmllm-launcher"
path = "src/bin/launcher.rs"

[dependencies]
# Global allocator for every binary built from this crate (daemon, model worker,
# examples, tests). candle allocates per op on the CPU path; glibc malloc was a
# measurable slice of a decode step (see CHANGELOG v0.3.112).
mimalloc = { version = "0.1", default-features = false }
# Async runtime
tokio = { version = "1", features = ["full"] }

# P2P Networking
libp2p = { version = "0.56", features = [
    "tokio",
    "quic",
    "kad",
    "gossipsub",
    "request-response",
    "identify",
    "autonat",
    "dcutr",
    "upnp",
    "relay",
    "noise",
    "dns",
    "tcp",
    "yamux",
    "macros",
    "serde",
    "mdns",
] }
libp2p-stream = "0.4.0-alpha"

# HTTP server
socket2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "timeout"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
safetensors = "0.7"

# Cryptography
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek = "4"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
blake3 = "1"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"

# LLM inference
llama-cpp-2 = { version = "0.1", optional = true }

# CUDA runtime dynamic loading — cudarc dlopens the CUDA redist DLLs (cudart,
# cublas, cublasLt, curand, nvrtc + builtins) at runtime rather than linking
# them at build time. Used by both Linux CUDA and Windows GPU builds.
#
# Users need:
#  - NVIDIA display driver (provides libcuda.so / nvcuda.dll — always present
#    on a system with an NVIDIA GPU).
#  - CUDA redist DLLs on the library search path. On Windows we bundle them
#    next to swarmllm-gpu.exe in the installer (onnxruntime/pytorch pattern).
#    On Linux, CUDA Toolkit or the redist tarball provides them.
#
# Why not `static-linking`? Shrinks the binary by ~150 MB but requires the
# CUDA static libs at build time (many CI images ship only the shared libs).
# Why not `dynamic-linking`? Requires import libs (*.lib / *.so) at link time
# AND the matching DLLs at runtime — worst of both worlds for distribution.
cudarc = { version = "0.19", features = ["dynamic-loading"], optional = true }

# Split inference (candle-based, layer-range execution)
candle-core = { version = "0.10", default-features = false }
candle-nn = { version = "0.10", default-features = false }
candle-transformers = { version = "0.10", default-features = false }
# The fused attention softmax (`inference::attn_softmax`) parallelises over
# score rows on the SAME global pool candle's own CPU kernels use, so the
# worker's `RAYON_NUM_THREADS` still governs the whole forward pass.
rayon = "1"
# Vendored: two patches, both annotated in the files themselves.
#   1. Links the CUDA runtime STATICALLY. Upstream's `dylib=cudart` puts a hard
#      libcudart dependency on the binary, which is exactly what the
#      `dynamic-loading` choice above exists to avoid — a release binary must
#      need only the NVIDIA display driver.
#   2. Drops the 18 bf16 kernels. `run_attention` casts to f16 before every
#      call, so they had no reachable caller and were half the kernel compile.
candle-flash-attn = { path = "vendor/candle-flash-attn", optional = true }

# Database
redb = "4"

# Concurrent state
dashmap = "6"
# Physical (not logical) core count. Already in the tree transitively; the
# distinction matters because exceeding physical cores makes quantised
# inference SLOWER — see `ResourceConfig::inference_cpu_threads`.
num_cpus = "1"
parking_lot = "0.12"
async-trait = "0.1"
# Lock-free atomic Arc swaps — used for hot-path read-mostly snapshots
# like `peer_balances` where every inbound CreditGossip rebuilds the
# snapshot and every inference credit-gate check reads it.
arc-swap = "1.7"

# Cross-platform local IPC (Unix sockets / Windows named pipes)
# Used by the daemon ↔ model-worker subprocess IPC layer.
interprocess = { version = "2.4", features = ["tokio"] }

# Utilities
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = "0.1"
futures = "0.3"
hex = "0.4"
base64 = "0.22"
dirs = "6"
bytes = "1"
async-stream = "0.3"
# include_dir moved to swarmllm-frontend crate
sysinfo = "0.38"
half = "2"
fancy-regex = "0.17"
encoding_rs = { version = "0.8", optional = true }
reqwest = { version = "0.12", features = ["json", "stream"] }

# Core types
swarmllm-types = { path = "crates/swarmllm-types" }

# Frontend assets
swarmllm-frontend = { path = "crates/swarmllm-frontend", default-features = false }

# Memory-mapped I/O for fast model loading
memmap2 = "0.9"

# Compression
zstd = "0.13"

# Image processing (for VLM vision encoder)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# libc for umask (Unix-only — used to atomically chmod IPC sockets at bind time
# to close the TOCTOU window between bind and explicit set_permissions).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["swarmllm-frontend/embedded"]
dev = ["swarmllm-frontend/dev"]

# --- Core inference backends ---
llama = ["llama-cpp-2", "encoding_rs"]
# candle-cuda enables candle's CUDA code paths AND activates our top-level
# cudarc dep with dynamic-loading. The [patch.crates-io] pin of candle-core
# removes its upstream-hardcoded `cudarc/dynamic-linking` activation; our
# dep then picks the linking mode (dynamic-loading). float8 0.7.0+ no
# longer imports cudarc at all, so no patch needed on that side.
candle-cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "dep:cudarc",
]
flash-attn = ["candle-cuda", "dep:candle-flash-attn"]

# Linux/macOS: full CUDA (llama.cpp CUDA + candle CUDA + flash-attention-2).
#
# flash-attn was dropped from this list in 2026-04 for two reasons, BOTH of
# which have since expired:
#
#   * "it adds ~60 min to CI and pushed Linux CUDA past 3h" — fixed three
#     months later by `cache-warm.yml`, not by dropping the feature, so it is
#     a one-time cost per cache key rather than a per-release one.
#
#     The sentence that used to sit here — "the kernels land in `target/`,
#     which rust-cache caches" — was FALSE, and believing it is what hid the
#     cost for months. rust-cache deletes `target/` artifacts belonging to any
#     package whose manifest is inside the repo, and candle-flash-attn is
#     vendored, so the kernels were rebuilt on every release despite a cache
#     that reported a full hit (~39 min Windows, ~27 min Linux; gotcha #318).
#     They now live outside `target/` in `.flash-attn-build` with a cache of
#     their own — see .github/actions/gpu-build-env.
#   * "mostly an A100/H100 win" — backwards. FlashAttention's advantage comes
#     from not round-tripping the attention matrix through HBM, so the SLOWER
#     the memory the bigger the win; consumer Ampere benefits more than a
#     data-centre card, not less.
#
# The real cost is the one this re-enable is paying deliberately: every
# candle-flash-attn kernel is `_sm80`, so the CUDA builds now target compute
# capability 8.0 (Ampere) and pre-Ampere NVIDIA cards — GTX 16-series and
# RTX 20-series — no longer get the candle GPU path. They fall back to CPU
# with an explicit message rather than a CUDA error; see
# `daemon::gpu_support::compute_cap_supported`.
cuda = ["llama", "llama-cpp-2/cuda", "candle-cuda", "flash-attn"]

# llama.cpp with Vulkan backend — works on NVIDIA, AMD, and Intel GPUs without CUDA install.
# Runtime requirement: vulkan-1.dll (bundled with standard GPU drivers — no user action needed).
# Build requirement: VULKAN_SDK env var pointing to installed Vulkan SDK.
llama-vulkan = ["llama", "llama-cpp-2/vulkan"]

# Windows GPU: llama.cpp via Vulkan (all GPU vendors, local inference) +
# candle via CUDA dynamic-loading (NVIDIA split/distributed inference).
# Installer bundles NVIDIA redist DLLs next to swarmllm-gpu.exe so end users
# need only the GeForce driver installed (no CUDA Toolkit).
#
# flash-attn is included here for the same reason as `cuda` above, and it is
# only the candle half that it affects: local inference on this build goes
# through llama.cpp/Vulkan, which is unchanged and still runs on every GPU
# vendor including pre-Ampere NVIDIA. What a Turing owner loses on Windows is
# the candle split/distributed path, not the ability to run a model locally.
windows-gpu = ["llama-vulkan", "candle-cuda", "flash-attn"]

# Future — wgpu/WebGPU backend for candle (cross-platform GPU for split/distributed inference).
# Would enable NVIDIA, AMD, and Intel GPU acceleration for distributed inference on all platforms
# using Vulkan, DX12, or Metal under the hood. Tracked upstream in huggingface/candle.
# Uncomment when candle gains a stable wgpu backend:
# candle-wgpu = ["candle-core/wgpu", "candle-nn/wgpu", "candle-transformers/wgpu"]
# windows-gpu-full = ["llama-vulkan", "candle-wgpu"]

# --- Optional provider integrations ---
# Claude Subscription: proxy Claude model requests through a locally-authenticated `claude` CLI
# subprocess (Pro/Max/Team/Enterprise subscription). Isolated for easy removal.
claude-subscription = []

[dev-dependencies]
tempfile = "3"

# Prices the CUDA attention path's per-token reshape/cast. Needs the GPU
# feature to compile at all, so it must be gated — `cargo clippy --all-targets`
# (which CI runs without GPU features) would otherwise fail on the unresolved
# `candle_flash_attn`. Same trap as gotcha #264, caught here by the pre-push
# hook rather than by a broken release.
[[example]]
name = "gpu_decode_bench"
# `path` is NOT optional here even though it matches the default location.
# Without it cargo resolves the example by scanning `examples/`, and FAILS TO
# PARSE THE MANIFEST when that directory is absent — which is exactly the
# Dockerfile's build context (it copies src/, crates/, frontend/, config/ and
# nothing else). Declaring the path defers the existence check to the point of
# actually building the example, which `cargo build --release` never does.
# Every `[[example]]` entry here must carry one; pinned by
# `every_declared_example_has_an_explicit_path`.
path = "examples/gpu_decode_bench.rs"
required-features = ["flash-attn"]

[[test]]
name = "integration"
path = "tests/integration/api_test.rs"

[[test]]
name = "integration_phase10_11"
path = "tests/integration/main.rs"

[[test]]
name = "yamux_substream"
path = "tests/integration/test_yamux_substream.rs"

[[example]]
name = "swarm_spec_bench"
path = "examples/swarm_spec_bench.rs"

[patch.crates-io]
libp2p-request-response = { path = "vendor/libp2p-request-response" }
# Upstream candle 0.10.1 hardcodes `cudarc/dynamic-linking` in its
# Cargo.toml, preventing downstream consumers from choosing a different
# linking mode (e.g. `dynamic-loading` so the binary can ship the NVIDIA
# redist DLLs next to itself instead of requiring the CUDA Toolkit on
# end-user machines). This vendored copy removes the hardcode — see
# vendor/candle/candle-core/Cargo.toml for the annotated
# `# SwarmLLM patch:` diff. Tracked upstream; will be dropped when
# candle accepts a gated-feature PR.
# (float8 0.7.0 dropped the cudarc dep entirely upstream, so the earlier
# vendor/float8/ patch is obsolete and has been removed.)
candle-core = { path = "vendor/candle/candle-core" }

[profile.dev]
# Faster dev builds: reduce debug info, enable incremental
debug = 1
incremental = true

[profile.dev.package."*"]
# Optimize dependencies even in dev mode (huge perf win for candle/libp2p)
opt-level = 2

[profile.release]
opt-level = 3
strip = true
# codegen-units = 16 is Rust's default for the release profile. Using 1
# trades ~10% more compile time for ~2–3% runtime perf via better cross-
# unit inlining, but on CUDA-enabled CI jobs it serializes LLVM enough
# to push build over 3h — past the GitHub runner's practical timeout.
codegen-units = 16
# LTO disabled: \`thin\` LTO on Linux CUDA pushes the linker over the
# GitHub runner's 7 GB RAM ceiling during final link
# (`collect2: fatal error: ld terminated with signal 7 [Bus error]`).
# Alpha binaries trade ~5% steady-state runtime perf for reliable CI;
# can revisit for v1.0 with a dedicated release-full profile + larger
# runner or a staged link strategy.
lto = false

[profile.test]
# Faster test compilation
debug = 1
incremental = true

[profile.test.package."*"]
opt-level = 2

# ---- Package Distribution ----

[package.metadata.deb]
maintainer = "SwarmLLM <security@enapt.dev>"
depends = "$auto, openssl (>= 3.0)"
section = "net"
priority = "optional"
extended-description = """SwarmLLM is a single binary that functions as a peer-to-peer node \
in a decentralized LLM inference network. Each node participates in a P2P network, \
runs an HTTP server (OpenAI-compatible API + admin dashboard), and manages local \
resources (GPU/CPU compute, storage, bandwidth)."""
assets = [
    ["target/release/swarmllm", "usr/bin/", "755"],
    ["config/default.toml", "etc/swarmllm/default.toml", "644"],
    ["packaging/swarmllm.service", "usr/lib/systemd/system/swarmllm.service", "644"],
]
conf-files = ["/etc/swarmllm/default.toml"]
maintainer-scripts = "packaging/deb/"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/swarmllm", dest = "/usr/bin/swarmllm", mode = "755" },
    { source = "config/default.toml", dest = "/etc/swarmllm/default.toml", mode = "644", config = true },
    { source = "packaging/swarmllm.service", dest = "/usr/lib/systemd/system/swarmllm.service", mode = "644" },
]

[package.metadata.generate-rpm.requires]
openssl = ">= 3.0"
