[workspace]
resolver = "2"
members = [".", "crates/swarmllm-frontend"]
exclude = ["vendor/candle-paged-attention", "vendor/libp2p-request-response"]

[package]
name = "swarmllm"
version = "0.1.0"
edition = "2021"
default-run = "swarmllm"
description = "Decentralized peer-to-peer LLM inference network"
license = "MIT OR Apache-2.0"
repository = "https://github.com/enapt/SwarmLLM"
homepage = "https://github.com/enapt/SwarmLLM"
keywords = ["llm", "p2p", "inference", "distributed", "decentralized"]
categories = ["network-programming", "science"]
rust-version = "1.80"

[[bin]]
name = "swarmllm"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# P2P Networking
libp2p = { version = "0.55", features = [
    "tokio",
    "quic",
    "kad",
    "gossipsub",
    "request-response",
    "identify",
    "autonat",
    "dcutr",
    "relay",
    "noise",
    "dns",
    "tcp",
    "yamux",
    "macros",
    "serde",
    "mdns",
] }

# HTTP server
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
safetensors = "0.7"

# Cryptography
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek = "4"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
blake3 = "1"
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"

# LLM inference
llama-cpp-2 = { version = "0.1", optional = true }

# Split inference (candle-based, layer-range execution)
candle-core = { version = "0.9", default-features = false }
candle-nn = { version = "0.9", default-features = false }
candle-transformers = { version = "0.9", default-features = false }
candle-flash-attn = { version = "0.9", optional = true }
candle-paged-attention = { path = "vendor/candle-paged-attention", optional = true }

# Database
redb = "3"

# Concurrent state
dashmap = "6"
async-trait = "0.1"

# Utilities
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = "0.1"
futures = "0.3"
hex = "0.4"
base64 = "0.22"
dirs = "6"
bytes = "1"
# include_dir moved to swarmllm-frontend crate
sysinfo = "0.38"
half = "2"
fancy-regex = "0.17"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
encoding_rs = { version = "0.8", optional = true }
reqwest = { version = "0.12", features = ["json", "stream"] }

# Frontend assets
swarmllm-frontend = { path = "crates/swarmllm-frontend", default-features = false }

# Memory-mapped I/O for fast model loading
memmap2 = "0.9"

# Compression
zstd = "0.13"

# Image processing (for VLM vision encoder)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[features]
default = ["swarmllm-frontend/embedded"]
dev = ["swarmllm-frontend/dev"]
llama = ["llama-cpp-2", "encoding_rs"]
candle-cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
candle-metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
flash-attn = ["candle-cuda", "dep:candle-flash-attn"]
paged-attn = ["candle-cuda", "dep:candle-paged-attention"]
cuda = ["llama", "llama-cpp-2/cuda", "candle-cuda", "flash-attn", "paged-attn"]
metal = ["llama", "llama-cpp-2/metal", "candle-metal"]
rocm = ["llama", "llama-cpp-2/rocm"]

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
curve25519-dalek = "4"
reqwest = { version = "0.12", features = ["json", "stream"] }

[[test]]
name = "integration"
path = "tests/integration/api_test.rs"

[[test]]
name = "integration_phase10_11"
path = "tests/integration/main.rs"

[[test]]
name = "yamux_substream"
path = "tests/integration/test_yamux_substream.rs"

[patch.crates-io]
libp2p-request-response = { path = "vendor/libp2p-request-response" }

[profile.dev]
# Faster dev builds: reduce debug info, enable incremental
debug = 1
incremental = true

[profile.dev.package."*"]
# Optimize dependencies even in dev mode (huge perf win for candle/libp2p)
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[profile.test]
# Faster test compilation
debug = 1
incremental = true

[profile.test.package."*"]
opt-level = 2
