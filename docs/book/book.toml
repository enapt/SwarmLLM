[book]
title = "SwarmLLM Documentation"
authors = ["SwarmLLM Contributors"]
description = "Documentation for SwarmLLM — decentralized peer-to-peer LLM inference"
language = "en"
src = "src"

[build]
build-dir = "../../target/book"
create-missing = false

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/enapt/SwarmLLM"
edit-url-template = "https://github.com/enapt/SwarmLLM/edit/main/docs/book/src/{path}"
site-url = "/SwarmLLM/"
no-section-label = false
additional-css = ["theme/custom.css"]
copy-fonts = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
use-hierarchical-headings = true
