# SwarmLLM configuration TEMPLATE.
#
# On a packaged install this file lives at /etc/swarmllm/default.toml and is
# copied to the node's data directory (/var/lib/swarmllm/config.toml) the first
# time the package is installed. The daemon reads the DATA-DIRECTORY copy, and
# the dashboard writes it — so once a node has started, edit that file (or use
# the dashboard) rather than this one. Editing this file afterwards has no
# effect on a node that is already set up.

[node]
# data_dir = "~/.local/share/swarmllm"    # Platform default
listen_port = 8800
contribution = "minimal"       # "minimal", "moderate", "maximum" — change in dashboard.
                               # Governs how much of your VRAM/disk this node commits to
                               # hosting models for the swarm. Higher = more models kept ready
                               # to serve. Loaded models stay resident in VRAM to serve peers;
                               # see [auto_manage] idle_unload_secs to reclaim idle VRAM.

[resources]
max_gpu_vram_mb = 0            # 0 = auto (80% of detected GPU used for inference; rest stays on disk for P2P)
max_ram_mb = 0                 # 0 = auto (50% of system RAM with a GPU, 80% on a CPU-only node)
max_disk_mb = 50000            # 50GB for model storage
max_bandwidth_mbps = 0         # 0 = auto from [node] contribution (10/50/unlimited Mbps)
max_cpu_threads = 0            # 0 = auto from [node] contribution (half / three-quarters / all
                               # PHYSICAL cores). More threads than physical cores makes
                               # inference slower, not faster — it is memory-bound.

[network]
# Bootstrap peers: one or more publicly-reachable "anchor" nodes new nodes
# dial on startup to join the network before decentralized discovery kicks in.
# Defaults to the project's built-in anchor, so a fresh install joins the public
# swarm with no configuration. To seed your own network instead, list your
# anchor's multiaddr(s) (see docs/NETWORKING.md):
#   bootstrap_peers = ["/dns4/anchor.example.net/tcp/8810/p2p/12D3KooW...your-anchor-peer-id..."]
# An empty list is treated as "not configured" and falls back to the built-ins.
# To genuinely run with none — a private or air-gapped swarm — say so:
#   disable_default_bootstrap = true
enable_relay = true
enable_relay_client = true
# Ceiling on simultaneous peer connections. Left unset it follows
# [node] contribution — minimal 150, moderate 300, maximum 500. Set a number
# to override that in either direction.
# max_peers = 150
enable_mdns = true                 # LAN discovery via mDNS (finds peers on same network)
enable_autonat = true              # NAT detection (set false on WSL2 to prevent connection races)
enable_dcutr = true                # Hole punching (set false on WSL2 to prevent connection races)
enable_upnp = true                 # UPnP/IGD gateway port-mapping — auto-opens the P2P port on a
                                   # cooperative home router for zero-config internet reachability
                                   # (set false on WSL2; inert behind CGNAT / non-UPnP routers)
# external_addresses = ["/dns4/anchor.example.net/tcp/8810", "/dns4/anchor.example.net/udp/8800/quic-v1"]
                                   # Declare how THIS node is reachable from the internet (port-forwarded
                                   # box, VPS, or dyndns anchor). Omit the trailing /p2p — the daemon
                                   # appends its own. List both transports (TCP + QUIC) to advertise a
                                   # readable name on each. A single string also works:
                                   #   external_address = "/ip4/203.0.113.5/tcp/8810"
                                   # Flows into identify, the DHT, and every invite code this node mints.
enable_encryption = true           # E2E encryption for tensor forwards.
                                   # Note: speculative / DSD / remote-generate
                                   # fast paths currently bypass the per-tensor
                                   # ChaCha session layer (deferred — see
                                   # docs/ARCHITECTURE.md § "Distributed
                                   # inference fast paths"). Standard pipeline
                                   # encryption is unaffected.
enable_quic = true                 # QUIC transport (set false on WSL2 — QUIC wins connection race over TCP)
# listen_address = "0.0.0.0"      # Bind address for P2P (set "127.0.0.1" on WSL2)
# gossip_network_id = "my-private-net"  # Uncomment for private networks (default: "swarmllm-mainnet-v1")

[inference]
default_model = ""             # Empty = first available
session_timeout_seconds = 600
max_concurrent_requests = 10
# model_path = "/path/to/model.gguf"  # Uncomment and set to load a model
gpu_layers = -1                # -1 = auto (use the GPU when one is available), 0 = CPU only.
                               # The split engine places a worker's whole layer window on one device,
                               # so a positive value means the same as -1; use shard windows to bound VRAM.
max_batch_size = 1             # 1 = no batching (sequential); >1 enables batching for both local and remote forwards (pipeline bubble filling)
batch_timeout_ms = 50          # Ms to wait for more requests before dispatching a partial batch (0 = immediate)
privacy_mode = false           # When true, user prompts are NOT written to disk (KV-cache sessions stay in-memory only)
# local_embedding_privacy = false  # Embed tokens locally before sending to first segment (remote never sees raw tokens)
# encrypted_pipeline = false   # Force first+last segment local (boomerang). No remote sees plaintext. Adds ~1 RTT/token. Per-model override via API.
# tensor_parallel = false      # Split single layers across LAN peers with per-layer AllReduce. OFF by default:
                               # over Ethernet the 2 round trips per layer cost more than the compute they split,
                               # and SwarmLLM's default pipeline parallelism moves one activation per SEGMENT instead.
                               # Only worth enabling for a large model on a very fast LAN, after measuring.
# tp_max_latency_ms = 10       # Max peer RTT to admit into a tensor-parallel group (only used when tensor_parallel = true)
# share_prefix_cache_with_peers = false
                               # Offer this node's prompt prefix cache to other nodes. OFF by default.
                               # Turning it on publishes, to the whole swarm, hashes chained over the
                               # token blocks of every prompt this node caches — a hash of a prompt is a
                               # commitment to it, so a guessed system prompt can be confirmed against it
                               # — and serves the prompt's own token IDs, plus its key/value cache, to any
                               # peer that asks for a block it announced. Worth enabling across machines
                               # you control, where several nodes share a system prompt. Your own local
                               # prefix cache is unaffected either way and stays on.

[logging]
level = "info"                 # trace, debug, info, warn, error
format = "pretty"              # "pretty" or "json"

[ui]
open_browser_on_start = true   # Open browser to dashboard/setup on launch

[updates]
auto_update = "stable"         # "disabled", "stable", or "all"
check_interval_hours = 6

[api]
# api_key = ""                   # Bearer token for API auth. Empty = auto-generate on first run.
# rate_limit_rpm = 60            # Max requests/min for /v1/ and /api/chat endpoints (default: 60)
# rate_limit_admin_rpm = 200     # Max requests/min for /api/admin/ endpoints (default: 200)
# Which networks the dashboard is handed its access key on automatically.
# Anywhere else it still works — the page asks you to paste the key once.
# dashboard_trust_overlay = true # Trust Tailscale-style overlays (100.64.0.0/10,
                                 # fd7a:115c:a1e0::/48), but only when THIS node is on
                                 # one too. Set false if you share your tailnet with
                                 # people you would not give admin access to.
# dashboard_trust_lan = false    # Trust any private/LAN address. Off by default: a LAN
                                 # is not an authenticated boundary. Turn on if you reach
                                 # this node through a Tailscale subnet router or a
                                 # container, where requests arrive from the router's
                                 # address rather than your device's.

[model]
shard_size_mb = 512            # Shard size in MB (64-2048, power of 2 recommended)

[auto_manage]
# enabled = true               # Auto-acquire shards from peers and HuggingFace (default: on)
# max_storage_mb = 0           # 0 = use 50% of max_disk_mb
# interval_minutes = 5         # How often to check for new shards to download
# max_shards = 0               # 0 = unlimited within disk budget
# max_concurrent_downloads = 3 # Max simultaneous shard downloads
# prune_enabled = true         # Auto-prune over-replicated shards (default: on)
# min_replicas = 2             # Minimum shard replicas to maintain across network
# prune_cooldown_secs = 300    # Seconds between prune actions on the same model
# max_holder_load_for_prune = 3 # Block pruning if remaining holders avg load exceeds this
# idle_unload_secs = 300       # Free a loaded model's GPU memory after this many seconds with
                               # NO local requests AND low network demand. Shards stay on disk;
                               # the model reloads (cold start) on the next request, and your
                               # holder status is unchanged. So VRAM follows real demand instead
                               # of staying pinned. 0 = never idle-unload (keep models resident
                               # until VRAM pressure forces eviction). Deliberately-held models
                               # are never idle-unloaded: reference/test models (`get-model`),
                               # pinned/locked models, and encrypted-pipeline models.
#
# VRAM pressure eviction (automatic, not configurable): above 70% VRAM the daemon
# narrows loaded models to fewer shards to free space; above 95% it fully unloads a
# model. Both keep shards on disk. idle_unload_secs above is the demand-driven path
# that reclaims VRAM *before* pressure is reached.

[pool]
# Device Pools ("My Devices"): Link your personal machines so credits combine.
max_pool_size = 10             # Maximum devices per pool (personal devices only)
invitation_ttl_hours = 24      # How long an invite code stays valid
rate_limit_per_hour = 10       # Max pool operations per hour
gossip_interval_secs = 600     # How often to gossip pool state (10 min)
# Credit rates: [pool.credit_rates] — see docs for per-pool overrides

# Private Mode: restrict YOUR inference requests to pool devices only.
# Your nodes still contribute to the swarm (serve others, seed shards, earn credits).
# private_mode = false           # Toggle via dashboard or API (persisted to DB)
# private_mode_allow_lan = true  # Also allow LAN peers (mDNS-discovered) when private
# offline_mode = false           # Air-gapped: no bootstrap, no HF downloads, mDNS only
